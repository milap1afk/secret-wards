# Secret Wards privacy policy. Simple "key: value" lines.
# Each value is a measured privacy-vs-utility trade-off (tools/attack.py + tools/score.py); see README.md.

age_band_years: 10         # 47 -> 40-49. The band always contains the true age.
age_top_code: 85           # 85 and older -> "85+": very old patients are few and easy to single out
date_shift_max_days: 180   # every date of ONE patient moves by the same secret offset (intervals kept)
date_shift_min_days: 7     # never a near-zero shift
location_level: district   # village and tehsil -> district (district is kept: research needs it)
pin_policy: prefix3        # 229678 -> 229***
dob_policy: year           # date of birth -> birth year only
rare_k: 0                  # 0 = off. Measured: ICD-chapter generalisation of rare codes cost 1.4% of probes for no attack gain
embed_pseudonym: 1         # the pseudonym is written inside every exported record
